name: 'Carapace Security Scan'
description: 'Runtime security scanning for AI agent projects'

inputs:
  config-path:
    description: 'Path to .carapace.yml config file'
    required: false
    default: '.carapace.yml'
  scan-path:
    description: 'Path to scan'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install

    - name: Build
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build

    - name: Run Carapace Scan
      shell: bash
      working-directory: ${{ inputs.scan-path }}
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        node "$ACTION_PATH/packages/cli/dist/index.js" scan --config "$CONFIG_PATH"
